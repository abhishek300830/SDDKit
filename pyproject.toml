[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ssdkit"
version = "0.1.0"
description = "Spec-driven development toolkit for Claude Code and Cursor — deterministic traceability, hook-enforced approval gates, and an audit log."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
keywords = ["ai", "claude", "cursor", "spec-driven", "developer-tools", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.0",
]

[project.scripts]
sddkit = "sddkit.cli:app"

[project.urls]
Homepage = "https://github.com/abhishek300830/ssdkit"
Repository = "https://github.com/abhishek300830/ssdkit"
Issues = "https://github.com/abhishek300830/ssdkit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/sddkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
